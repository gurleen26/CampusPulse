{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-shell"><div class="card auth-card">
    <div class="auth-icon"><i class="bi bi-shield-lock"></i></div><div class="eyebrow">CAMPUSPULSE ACCOUNT</div><h1 class="mb-2">Welcome back</h1><p class="text-muted small mb-4">Sign in to continue to your CampusPulse account.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" value="{{ email or '' }}" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="mt-3 mb-0 small text-muted">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div></div>
{% endblock %}
