{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-shell"><div class="card auth-card">
    <div class="auth-icon"><i class="bi bi-person-plus"></i></div><div class="eyebrow">CAMPUSPULSE ACCOUNT</div><h1 class="mb-2">Create your account</h1><p class="text-muted small mb-4">Join CampusPulse and help make your campus better.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Full name</label>
        <input name="name" class="form-control" value="{{ name or '' }}" required minlength="2" maxlength="80"></div>
      <div class="mb-3"><label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" value="{{ email or '' }}" required></div>
      <div class="row">
        <div class="col-md-6 mb-3"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required minlength="8">
          <div class="form-text">At least 8 characters, with letters and numbers.</div></div>
        <div class="col-md-6 mb-3"><label class="form-label">Confirm password</label>
          <input type="password" name="confirm" class="form-control" required></div>
      </div>
      <button class="btn btn-primary w-100">Create account</button>
    </form>
  </div></div>
{% endblock %}
